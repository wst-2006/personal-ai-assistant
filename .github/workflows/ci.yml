name: Public CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit public release boundary
        run: corepack pnpm release:audit

      - name: Type-check workspace
        run: corepack pnpm check

      - name: Run database-free unit tests
        run: corepack pnpm test:unit

      - name: Build publishable web and server packages
        run: corepack pnpm build
