name: 错误反馈
description: 报告可复现的软件问题，请勿提交任何密钥或个人数据
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除 API Key、数据库密码、飞书标识、真实任务、健康信息、用户名和本地路径。安全问题请按照 SECURITY.md 使用私密报告，不要公开漏洞细节。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 0.1.20
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 出现问题的区域
      options:
        - 今天 / 时间轴
        - 专注窗口
        - 复盘 / 简报 / 日记
        - 成长
        - 健康参考
        - 设置 / 个性化
        - 飞书
        - 安装 / 启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构任务和脱敏内容描述。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 只填写 Windows 版本、PostgreSQL 主版本以及是否使用桌面安装版；不要粘贴 `.env`。
      placeholder: Windows 11 / PostgreSQL 18 / 桌面安装版
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交 API Key、密码、Token、飞书标识、真实个人数据或未脱敏日志。
          required: true
